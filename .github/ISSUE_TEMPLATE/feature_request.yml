name: Feature request
description: Propose an improvement or new capability.
title: "feat: "
labels:
  - enhancement
  - status:needs-review
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I understand this issue needs status:approved before a PR can be opened.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What user or engineering problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the expected behavior and boundaries.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web app
        - Domain
        - Persistence
        - Verification
        - PWA
        - Documentation
        - Infrastructure
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add acceptance criteria, links, or screenshots when useful.
    validations:
      required: false
