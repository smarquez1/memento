pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,json}"
      run: pnpm biome check --staged --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    format:
      glob: "*.{js,jsx,ts,tsx,json}"
      run: pnpm biome format --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
